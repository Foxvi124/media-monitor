name: weekly

on:
  schedule:
    - cron: "30 22 * * 0"   # Minggu 22:30 UTC = Senin 05:30 WIB
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Buat rekap mingguan
        run: python run.py --weekly --config config.yaml --output digests --history history.json
      - name: Commit rekap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          git diff --cached --quiet && echo "tidak ada perubahan" || \
            git commit -m "rekap mingguan: $(date -u +%Y-%m-%d)" && git push
